<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zenyeno AI Ecommerce Analyzer</title>
  <style>
    :root { color-scheme: dark; --bg:#07111f; --panel:#101d2f; --line:#263852; --text:#edf4ff; --muted:#9db0c9; --brand:#55d6be; --accent:#6da7ff; --danger:#ff7b8b; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; background:radial-gradient(circle at top left,#102d42 0,transparent 35%),var(--bg); color:var(--text); }
    main { width:min(1120px,calc(100% - 32px)); margin:auto; padding:48px 0 72px; }
    header { display:flex; justify-content:space-between; gap:24px; align-items:end; margin-bottom:28px; }
    .eyebrow { color:var(--brand); font-weight:800; letter-spacing:.12em; text-transform:uppercase; font-size:.76rem; }
    h1 { font-size:clamp(2rem,5vw,4.2rem); line-height:.96; margin:.55rem 0 1rem; max-width:780px; }
    header p { color:var(--muted); max-width:700px; margin:0; line-height:1.65; }
    .links { display:flex; gap:10px; flex-wrap:wrap; }
    a { color:var(--text); text-decoration:none; border:1px solid var(--line); border-radius:999px; padding:9px 13px; }
    .layout { display:grid; grid-template-columns:minmax(0,1fr) minmax(340px,.9fr); gap:20px; align-items:start; }
    .panel { background:color-mix(in srgb,var(--panel) 92%,transparent); border:1px solid var(--line); border-radius:20px; padding:22px; box-shadow:0 24px 80px #0005; }
    h2 { margin:0 0 18px; font-size:1.1rem; }
    form { display:grid; gap:14px; }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    label { display:grid; gap:7px; color:var(--muted); font-size:.86rem; }
    input { width:100%; padding:12px 13px; border-radius:11px; border:1px solid var(--line); background:#091524; color:var(--text); outline:none; }
    input:focus { border-color:var(--accent); box-shadow:0 0 0 3px #6da7ff25; }
    details { border:1px solid var(--line); border-radius:12px; padding:12px; }
    summary { cursor:pointer; color:var(--muted); }
    details .grid { margin-top:13px; }
    button { border:0; border-radius:12px; padding:13px 18px; background:linear-gradient(135deg,var(--brand),var(--accent)); color:#06111d; font-weight:900; cursor:pointer; }
    button:disabled { opacity:.55; cursor:wait; }
    .status { min-height:22px; color:var(--muted); font-size:.9rem; }
    .status.error { color:var(--danger); }
    .empty { min-height:420px; display:grid; place-items:center; color:var(--muted); text-align:center; border:1px dashed var(--line); border-radius:14px; padding:30px; }
    .result[hidden] { display:none; }
    .score-row { display:grid; grid-template-columns:130px 1fr; gap:18px; align-items:center; }
    .score { width:126px; height:126px; border-radius:50%; display:grid; place-items:center; background:conic-gradient(var(--brand) calc(var(--score)*1%),#263852 0); position:relative; }
    .score::before { content:""; width:96px; height:96px; border-radius:50%; background:var(--panel); position:absolute; }
    .score strong { position:relative; font-size:2rem; }
    .decision { color:var(--brand); font-size:1.5rem; font-weight:900; }
    .metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:18px 0; }
    .metric { background:#091524; border:1px solid var(--line); border-radius:12px; padding:12px; }
    .metric span { display:block; color:var(--muted); font-size:.76rem; margin-bottom:5px; }
    .metric strong { font-size:1.05rem; }
    pre { white-space:pre-wrap; word-break:break-word; background:#07111f; border:1px solid var(--line); border-radius:12px; padding:14px; max-height:360px; overflow:auto; color:#d7e6f8; line-height:1.55; }
    footer { color:var(--muted); margin-top:18px; font-size:.8rem; }
    @media (max-width:850px) { header{display:block}.links{margin-top:18px}.layout{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.metrics{grid-template-columns:1fr 1fr} }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <div class="eyebrow">Zenyeno Intelligence Engine · v1.1</div>
        <h1>把商品成本变成可执行的市场判断</h1>
        <p>输入商品与真实费用参数，系统会计算建议售价、净利润、市场趋势、竞争修正和销售决策。当前版本为透明规则基线，不伪装成实时平台数据。</p>
      </div>
      <nav class="links"><a href="/docs">API 文档</a><a href="https://github.com/zenyenochen-alt/zenyeno-ai-core">GitHub</a></nav>
    </header>

    <section class="layout">
      <div class="panel">
        <h2>商品参数</h2>
        <form id="analysis-form">
          <div class="grid">
            <label>商品名称<input name="name" value="Foldable Storage Box" required maxlength="200"></label>
            <label>商品类目<input name="category" value="Home Storage" required maxlength="120"></label>
            <label>目标市场<input name="market" value="TikTok Philippines" required maxlength="120"></label>
            <label>采购成本<input name="cost" value="5" type="number" min="0.01" step="0.01" required></label>
          </div>
          <details>
            <summary>真实费用与安全设置</summary>
            <div class="grid">
              <label>币种<input name="currency" value="USD" minlength="3" maxlength="3"></label>
              <label>物流成本<input name="shipping_cost" value="0" type="number" min="0" step="0.01"></label>
              <label>单次广告成本<input name="advertising_cost" value="0" type="number" min="0" step="0.01"></label>
              <label>平台费率 %<input name="platform_fee_percent" value="0" type="number" min="0" max="50" step="0.1"></label>
              <label>税率 %<input name="tax_percent" value="0" type="number" min="0" max="50" step="0.1"></label>
              <label>退货准备金 %<input name="return_rate_percent" value="0" type="number" min="0" max="50" step="0.1"></label>
              <label>目标利润率 %<input name="target_margin_percent" value="20" type="number" min="0" max="89" step="0.1"></label>
              <label>API Key（如服务器启用）<input id="api-key" type="password" autocomplete="off"></label>
            </div>
          </details>
          <button id="submit" type="submit">开始分析</button>
          <div id="status" class="status" role="status"></div>
        </form>
      </div>

      <div class="panel">
        <div id="empty" class="empty">提交商品后，这里显示评分、利润拆分和行动报告。</div>
        <section id="result" class="result" hidden>
          <div class="score-row">
            <div id="score" class="score" style="--score:0"><strong id="score-value">0</strong></div>
            <div><div class="eyebrow">最终决策</div><div id="decision" class="decision">—</div><p id="product-name"></p></div>
          </div>
          <div class="metrics">
            <div class="metric"><span>建议售价</span><strong id="price">—</strong></div>
            <div class="metric"><span>预计净利润</span><strong id="profit">—</strong></div>
            <div class="metric"><span>净利润率</span><strong id="margin">—</strong></div>
            <div class="metric"><span>趋势分</span><strong id="trend">—</strong></div>
            <div class="metric"><span>竞争程度</span><strong id="competition">—</strong></div>
            <div class="metric"><span>总成本</span><strong id="total-cost">—</strong></div>
          </div>
          <h2>行动报告</h2>
          <pre id="report"></pre>
        </section>
      </div>
    </section>
    <footer>非商用公开源码。分析结果是透明基线估算，不代表实时平台数据。</footer>
  </main>
  <script>
    const form = document.querySelector('#analysis-form');
    const submit = document.querySelector('#submit');
    const statusBox = document.querySelector('#status');
    const numberFields = ['cost','shipping_cost','advertising_cost','platform_fee_percent','tax_percent','return_rate_percent','target_margin_percent'];

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      submit.disabled = true;
      statusBox.className = 'status';
      statusBox.textContent = '正在计算市场、价格和利润…';
      const data = Object.fromEntries(new FormData(form).entries());
      numberFields.forEach((field) => data[field] = Number(data[field]));
      data.currency = data.currency.toUpperCase();
      delete data['api-key'];
      const headers = {'Content-Type':'application/json'};
      const key = document.querySelector('#api-key').value;
      if (key) headers['X-API-Key'] = key;
      try {
        const response = await fetch('/analyze', {method:'POST', headers, body:JSON.stringify(data)});
        const body = await response.json();
        if (!response.ok) throw new Error(body.detail ? JSON.stringify(body.detail) : `HTTP ${response.status}`);
        render(body);
        statusBox.textContent = `分析完成 · Request ID: ${response.headers.get('X-Request-ID') || '—'}`;
      } catch (error) {
        statusBox.className = 'status error';
        statusBox.textContent = `分析失败：${error.message}`;
      } finally { submit.disabled = false; }
    });

    function render(data) {
      document.querySelector('#empty').hidden = true;
      document.querySelector('#result').hidden = false;
      document.querySelector('#score').style.setProperty('--score', data.final_score);
      document.querySelector('#score-value').textContent = data.final_score;
      document.querySelector('#decision').textContent = data.recommendation;
      document.querySelector('#product-name').textContent = `${data.product} · ${data.market}`;
      const currency = data.pricing.currency;
      document.querySelector('#price').textContent = `${currency} ${data.pricing.recommended_price.toFixed(2)}`;
      document.querySelector('#profit').textContent = `${currency} ${data.pricing.profit.toFixed(2)}`;
      document.querySelector('#margin').textContent = `${data.pricing.margin_percent.toFixed(2)}%`;
      document.querySelector('#trend').textContent = data.market_analysis.trend_score;
      document.querySelector('#competition').textContent = data.market_analysis.competition;
      document.querySelector('#total-cost').textContent = `${currency} ${data.pricing.total_cost.toFixed(2)}`;
      document.querySelector('#report').textContent = data.report;
    }
  </script>
</body>
</html>
