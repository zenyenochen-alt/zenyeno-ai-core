<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zenyeno AI 商品分析</title><style>
:root{color-scheme:dark;--bg:#07111f;--panel:#101d2f;--line:#263852;--text:#edf4ff;--muted:#9db0c9;--brand:#55d6be;--accent:#6da7ff;--danger:#ff7b8b}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:radial-gradient(circle at top left,#102d42,transparent 36%),var(--bg);color:var(--text)}main{width:min(1100px,calc(100% - 32px));margin:auto;padding:44px 0}header{display:flex;justify-content:space-between;gap:24px;align-items:end;margin-bottom:24px}.eyebrow{color:var(--brand);font-weight:800;letter-spacing:.1em;font-size:.78rem}h1{font-size:clamp(2rem,5vw,3.8rem);line-height:1;margin:.5rem 0 1rem}p{color:var(--muted);line-height:1.65}.links{display:flex;gap:10px}.links a{color:var(--text);text-decoration:none;border:1px solid var(--line);border-radius:99px;padding:9px 13px}.layout{display:grid;grid-template-columns:1fr 1fr;gap:20px}.panel{background:#101d2ff2;border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:0 24px 80px #0005}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:grid;gap:7px;color:var(--muted);font-size:.86rem}input{width:100%;padding:12px;border:1px solid var(--line);border-radius:11px;background:#091524;color:var(--text)}details{margin:14px 0;border:1px solid var(--line);border-radius:12px;padding:12px}details .grid{margin-top:12px}.actions{display:flex;gap:10px;flex-wrap:wrap}button{border:0;border-radius:12px;padding:13px 17px;background:linear-gradient(135deg,var(--brand),var(--accent));color:#06111d;font-weight:900;cursor:pointer}.secondary{background:#162a42;color:var(--text);border:1px solid var(--line)}button:disabled{opacity:.5}.status{min-height:24px;margin-top:12px;color:var(--muted)}.error{color:var(--danger)}.empty{min-height:390px;display:grid;place-items:center;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}.result[hidden]{display:none}.scoreline{display:flex;gap:18px;align-items:center}.score{width:110px;height:110px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--brand) calc(var(--score)*1%),#263852 0);font-size:1.8rem;font-weight:900}.decision{font-size:1.5rem;color:var(--brand);font-weight:900}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}.metric{background:#091524;border:1px solid var(--line);border-radius:12px;padding:12px}.metric span{display:block;color:var(--muted);font-size:.75rem}.metric strong{display:block;margin-top:5px}pre{white-space:pre-wrap;background:#07111f;border:1px solid var(--line);border-radius:12px;padding:14px;max-height:300px;overflow:auto}@media(max-width:820px){header{display:block}.links{margin-top:16px}.layout{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.metrics{grid-template-columns:1fr 1fr}}
</style></head><body><main><header><div><div class="eyebrow">Zenyeno Intelligence Engine · V1.1</div><h1>商品分析与候选入库</h1><p>输入商品成本与目标市场，计算潜力、趋势、定价和利润。配置私有桥接后，可将分析结果直接送入自动化候选库，后续仍需人工审批。</p></div><nav class="links"><a href="/docs">API 文档</a><a href="https://github.com/zenyenochen-alt/zenyeno-ai-core">GitHub</a></nav></header>
<section class="layout"><div class="panel"><h2>商品参数</h2><form id="form"><div class="grid"><label>商品名称<input name="name" value="Foldable Storage Box" required></label><label>类目<input name="category" value="Home Storage" required></label><label>目标市场<input name="market" value="TikTok Philippines" required></label><label>采购成本<input name="cost" value="5" type="number" min=".01" step=".01" required></label></div><details><summary>完整成本参数</summary><div class="grid"><label>币种<input name="currency" value="USD" maxlength="3"></label><label>物流成本<input name="shipping_cost" value="0" type="number" min="0" step=".01"></label><label>广告成本<input name="advertising_cost" value="0" type="number" min="0" step=".01"></label><label>平台费率 %<input name="platform_fee_percent" value="0" type="number" min="0" max="50"></label><label>税率 %<input name="tax_percent" value="0" type="number" min="0" max="50"></label><label>退货准备金 %<input name="return_rate_percent" value="0" type="number" min="0" max="50"></label><label>目标利润率 %<input name="target_margin_percent" value="20" type="number" min="0" max="89"></label><label>分析 API Key<input id="api-key" type="password" autocomplete="off"></label></div></details><div class="actions"><button type="submit" data-endpoint="/analyze">仅分析</button><button type="submit" class="secondary" data-endpoint="/analyze/import">分析并加入候选库</button></div><div id="status" class="status"></div></form></div>
<div class="panel"><div id="empty" class="empty">提交商品后，这里显示评分、利润和执行建议。</div><section id="result" class="result" hidden><div class="scoreline"><div id="score" class="score" style="--score:0">0</div><div><div class="eyebrow">最终建议</div><div id="decision" class="decision">—</div><p id="product"></p></div></div><div class="metrics"><div class="metric"><span>建议售价</span><strong id="price">—</strong></div><div class="metric"><span>净利润</span><strong id="profit">—</strong></div><div class="metric"><span>利润率</span><strong id="margin">—</strong></div><div class="metric"><span>趋势分</span><strong id="trend">—</strong></div><div class="metric"><span>竞争程度</span><strong id="competition">—</strong></div><div class="metric"><span>总成本</span><strong id="cost">—</strong></div></div><h2>行动报告</h2><pre id="report"></pre></section></div></section>
<script>const form=document.querySelector('#form'),statusBox=document.querySelector('#status');let endpoint='/analyze';form.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>endpoint=b.dataset.endpoint));form.addEventListener('submit',async e=>{e.preventDefault();const buttons=[...form.querySelectorAll('button')];buttons.forEach(b=>b.disabled=true);statusBox.className='status';statusBox.textContent=endpoint.endsWith('/import')?'正在分析并安全导入候选库…':'正在分析…';const data=Object.fromEntries(new FormData(form).entries());['cost','shipping_cost','advertising_cost','platform_fee_percent','tax_percent','return_rate_percent','target_margin_percent'].forEach(k=>data[k]=Number(data[k]));data.currency=data.currency.toUpperCase();const headers={'Content-Type':'application/json'},key=document.querySelector('#api-key').value;if(key)headers['X-API-Key']=key;try{const response=await fetch(endpoint,{method:'POST',headers,body:JSON.stringify(data)}),body=await response.json();if(!response.ok)throw new Error(body.detail||`HTTP ${response.status}`);const d=body.analysis||body;render(d);statusBox.textContent=body.import_receipt?`分析完成，已导入 ${body.import_receipt.imported} 个候选商品。`:'分析完成。'}catch(error){statusBox.className='status error';statusBox.textContent=`操作失败：${error.message}`}finally{buttons.forEach(b=>b.disabled=false)}});function render(d){document.querySelector('#empty').hidden=true;document.querySelector('#result').hidden=false;const s=document.querySelector('#score');s.style.setProperty('--score',d.final_score);s.textContent=d.final_score;document.querySelector('#decision').textContent=d.recommendation;document.querySelector('#product').textContent=`${d.product} · ${d.market}`;const c=d.pricing.currency;document.querySelector('#price').textContent=`${c} ${d.pricing.recommended_price.toFixed(2)}`;document.querySelector('#profit').textContent=`${c} ${d.pricing.profit.toFixed(2)}`;document.querySelector('#margin').textContent=`${d.pricing.margin_percent.toFixed(2)}%`;document.querySelector('#trend').textContent=d.market_analysis.trend_score;document.querySelector('#competition').textContent=d.market_analysis.competition;document.querySelector('#cost').textContent=`${c} ${d.pricing.total_cost.toFixed(2)}`;document.querySelector('#report').textContent=d.report}</script></main></body></html>
